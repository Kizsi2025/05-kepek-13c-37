name: CI
on: [push]
jobs:
  kartya5:
    name: Feladatkártya 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PyTorch (CPU) telepítése
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy matplotlib ultralytics pytest nbclient nbformat ipykernel
      - run: python -m pytest -v tests/test_kartya5.py
